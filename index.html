<title>Đại Ca Dữ Liệu - Bảng Điều Hành Công Trường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#E9ECE6; --ink:#1B2420; --muted:#5B6862; --line:#D5DBD4;
  --accent:#0E6655; --accent-ink:#FFFFFF; --amber:#C98407; --amber-soft:#FBEFD5;
  --ok:#2E7A48; --ok-soft:#E1F1E6; --warn:#B8740A; --warn-soft:#FBEFD5; --bad:#B8362A; --bad-soft:#F8E1DE; --idle:#6E7A74; --idle-soft:#E6EAE6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121815; --surface:#1A221E; --surface-2:#222C27; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2E3A34;
    --accent:#3FB39A; --accent-ink:#0B1411; --amber:#E7A93A; --amber-soft:#3A2E17;
    --ok:#5CC382; --ok-soft:#1C3325; --warn:#E7A93A; --warn-soft:#3A2E17; --bad:#EE7A6C; --bad-soft:#3D211D; --idle:#9AA8A1; --idle-soft:#26302B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121815; --surface:#1A221E; --surface-2:#222C27; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2E3A34;
  --accent:#3FB39A; --accent-ink:#0B1411; --amber:#E7A93A; --amber-soft:#3A2E17;
  --ok:#5CC382; --ok-soft:#1C3325; --warn:#E7A93A; --warn-soft:#3A2E17; --bad:#EE7A6C; --bad-soft:#3D211D; --idle:#9AA8A1; --idle-soft:#26302B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:14px}
.code{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1;letter-spacing:.01em}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:20px;color:var(--muted);font-weight:600}
.kpi .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.kpi{cursor:pointer;position:relative}
.kpi:hover{border-color:var(--accent)}
.kpi .pen{position:absolute;top:10px;right:12px;font-size:13px;color:var(--muted)}
@media print{.kpi .pen{display:none}}
.kpi .lab{padding-right:18px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important}
.kpi.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:600;min-height:110px;background:transparent}
@media print{.kpi.add{display:none}}
.kpi .val.txt{font-size:26px}
.kpi.hot{border-color:var(--amber);background:linear-gradient(0deg,var(--amber-soft),var(--surface) 70%)}
.kpi.hot .val{color:var(--amber)}

/* Tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--surface-2);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab .cnt.alert{background:var(--bad-soft);color:var(--bad)}

.panel{display:flex;flex-direction:column;gap:14px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.phead h2{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.01em}
.phead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Priority rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) 128px 40px;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-block:8px}
.pri{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.pri small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-weight:600}
.name{font-weight:600}
.detail{color:var(--muted);font-size:13px;margin-top:2px;white-space:pre-line}
.next{margin-top:6px;font-size:13px;background:var(--surface-2);border-radius:6px;padding:6px 8px;white-space:pre-line}
.next::before{content:"Hôm nay: ";font-weight:600;color:var(--accent)}
.cell-lab{display:none;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.due{font-variant-numeric:tabular-nums;font-weight:600}
.due.soon{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-run{background:var(--ok-soft);color:var(--accent)}
.s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)} .s-idle{background:var(--idle-soft);color:var(--idle)}
.edit{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;font-size:16px;line-height:1}
.edit:hover{background:var(--surface-2);color:var(--ink)}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
@media (max-width:760px){
  .row{grid-template-columns:44px minmax(0,1fr) 36px;gap:6px 10px}
  .row.head{display:none}
  .row > .c-owner,.row > .c-due,.row > .c-status{grid-column:2}
  .row > .c-edit{grid-column:3;grid-row:1}
  .cell-lab{display:inline;margin-right:6px}
}

/* Cards grid (yards) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:15px;font-weight:700}
.tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:4px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.stats div{display:flex;flex-direction:column}
.stats span{font-size:11px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{font-size:13px;color:var(--muted);white-space:pre-line}
.kv strong{color:var(--ink);font-weight:600}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
tfoot td{font-weight:700;background:var(--surface-2)}
.mini{display:inline-block;width:60px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.rain{color:var(--warn);font-weight:600}

/* Issues */
.issue{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 0;cursor:pointer;overflow:hidden}
.issue .sev{border-radius:0 4px 4px 0}
.issue.st-open .sev{background:var(--bad)} .issue.st-doing .sev{background:var(--warn)} .issue.st-done .sev{background:var(--ok)}
.issue.st-done .itext{text-decoration:line-through;color:var(--muted)}
.itext{font-weight:600}
.imeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;margin-top:4px}
.imeta b{color:var(--ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}

/* Chart */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.chart h3{font-size:13px;font-weight:600;margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block}

/* Routine */
.routine{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;counter-reset:r}
.routine div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}

.contact{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.contact .ph{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Sheet (editor) */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--display);font-size:22px;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--ink);font-size:14px;width:100%}
label.f textarea{min-height:70px;resize:vertical}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--bad)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:30;box-shadow:var(--shadow)}
.status-line{font-size:12px;color:var(--muted)}
.status-line.err{color:var(--bad)}
textarea.copybox{width:100%;min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.card,.tab{transition:border-color .15s,background .15s,color .15s}}

/* Bot Control Center */
.bot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.bot-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bot-card-title{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.bot-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;letter-spacing:.02em}
.bot-badge.ok{background:var(--ok-soft);color:var(--ok)}
.bot-badge.bad{background:var(--bad-soft);color:var(--bad)}
.bot-badge.warn{background:var(--warn-soft);color:var(--warn)}
.bot-cmd-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.bot-cmd-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.bot-cmd-code{font-family:monospace;font-size:14px;font-weight:700;color:var(--accent)}
.bot-logs{background:#121815;color:#5CC382;font-family:Consolas,monospace;font-size:12px;padding:14px;border-radius:8px;max-height:220px;overflow-y:auto;white-space:pre-wrap;line-height:1.45;border:1px solid var(--line)}

[hidden]{display:none!important}
.savebar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted)}
.savebar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:4px}
.savebar.dirty .dot{background:var(--amber)}
.help{font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted)}
.help b{color:var(--ink)}
.print-only{display:none}
.print-title{font-family:var(--display);font-size:22px;font-weight:700;margin:18px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
@page{size:A4 landscape;margin:10mm}
@media print{
  :root{--bg:#fff!important;--surface:#fff!important;--surface-2:#EEF1EC!important;--ink:#111!important;--muted:#444!important;--line:#C9D0C8!important;
    --accent:#0E6655!important;--amber:#A86B00!important;--amber-soft:#FFF4DC!important;--ok:#2E7A48!important;--ok-soft:#E1F1E6!important;
    --warn:#A86B00!important;--warn-soft:#FFF4DC!important;--bad:#B8362A!important;--bad-soft:#F8E1DE!important;--idle:#555!important;--idle-soft:#EEE!important;color-scheme:light}
  body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none;padding:0;gap:10px}
  .actions,.tabs,.edit,.btn,.filters,.help,#fileIn,.savebar{display:none!important}
  .print-only{display:block}
  .row,.card,.issue,.contact,tr,.chart,.kpi{break-inside:avoid}
  .tbl-wrap{overflow:visible}
  table{min-width:0}
  .phead p{display:none}
  .scrim,.toast{display:none!important}
  .kpi .val{font-size:28px}
}

function tileView(t){

function chartCnch(rows){
  const pts = rows.filter(r=>num(r.cnch)!=null&&num(r.cnchPlan)).map(r=>({d:r.date,v:Math.round(r.cnch/r.cnchPlan*100),r}));
  if (pts.length<2) return null;
  const W=640,H=180,L=36,R=12,T=16,B=30, iw=W-L-R, ih=H-T-B;
  const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)), y=v=>T+ih-(v/100)*ih;
  const NS="http://www.w3.org/2000/svg";
  const s=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
  const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Tỷ lệ công nhân cơ hữu theo ngày"});
  for (const g of [0,25,50,75,100]){
    svg.append(s("line",{x1:L,x2:W-R,y1:y(g),y2:y(g),stroke:"var(--line)","stroke-width":1}));
    svg.append(s("text",{x:L-6,y:y(g)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)"},g+"%"));
  }
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.v)}`).join("");
  svg.append(s("path",{d:line+`L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`,fill:"var(--accent)","fill-opacity":.1,stroke:"none"}));
  svg.append(s("path",{d:line,fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-linejoin":"round"}));
  pts.forEach((p,i)=>{
    const last=i===pts.length-1;
    svg.append(s("circle",{cx:x(i),cy:y(p.v),r:last?5:3.5,fill:last?"var(--accent)":"var(--surface)",stroke:"var(--accent)","stroke-width":2}));
    svg.append(s("text",{x:x(i),y:y(p.v)-9,"text-anchor":"middle","font-size":11,"font-weight":600,fill:"var(--ink)"},p.v+"%"));
    svg.append(s("text",{x:x(i),y:H-10,"text-anchor":"middle","font-size":11,fill:"var(--muted)"},fmtShort(p.d)));
  });
  return h("div",{class:"chart"},h("h3",{text:"Tỷ lệ công nhân cơ hữu so với kế hoạch tháng"}),svg);
}

  const p=$("#panel");
  p.append(phead("Nhật ký tiến độ theo ngày","Mỗi sáng thêm một dòng từ bản \"Mục tiêu thi công ngày\". Bấm vào dòng để sửa.",

function updateBotStatusIndicator(){
  const dot = $("#botLiveDot");
  if (dot) dot.style.background = botStatus.running ? "#5CC382" : (botStatus.zaloConnected ? "#E7A93A" : "#EE7A6C");

async function checkBotApiStatus(){
  const apiBase = (location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "" : "http://127.0.0.1:8080";
  try {
    const res = await fetch(`${apiBase}/api/status`, { signal: AbortSignal.timeout(2000) });
    if (res.ok) {
      const d = await res.json();
      botStatus.running = d.bot_running;
      botStatus.pid = d.bot_pid;
      botStatus.zaloConnected = d.zalo_connected;
      botStatus.zaloUser = d.zalo_user;
      botStatus.zaloUid = d.zalo_uid;
      botStatus.totalReports = d.total_reports;
      botStatus.totalItems = d.total_items;
      botStatus.totalPiles = d.total_piles;
      botStatus.aiProvider = d.ai_provider || "claude";
      botStatus.aiAvailable = d.ai_available || false;
      botStatus.aiModel = d.ai_model || "claude-3-5-haiku-20241022";
      updateBotStatusIndicator();
      return true;
    }
  } catch(e) {}
  updateBotStatusIndicator();
  return false;
}

async function callBotApi(endpoint, method="POST"){
  const apiBase = (location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "" : "http://127.0.0.1:8080";
  try {
    toast("Đang gửi lệnh xử lý...");
    const res = await fetch(`${apiBase}${endpoint}`, { method });
    const d = await res.json();
    toast(d.message || "Đã thực hiện xong!");
    await checkBotApiStatus();
    if (tab === "bot") render();
  } catch(e) {
    toast("Không kết nối được máy chủ nội bộ. Hãy chạy file CHAY_HE_THONG.bat trên máy tính!");
  }
}

  // 2. Tra cứu lệnh Zalo cho Điện Thoại

  const cmds = [

/* ---------- Editor ---------- */
function openEditor(coll, doc, preset){
  const sch = SCHEMA[coll]; const isNew = !doc; const val = {...(preset||doc||{})};
  if (isNew && !preset){ const st=sch.fields.find(f=>f.k==="status"); if(st) val.status=st.o[0]; if(coll==="issues") val.raised=isoToday; }
  const host=$("#sheetHost"); host.replaceChildren();
  const form=h("form",{class:"sheet",role:"dialog","aria-modal":"true"});
  const grid=h("div",{class:"fgrid"});
  for (const f of sch.fields){
    const id=`f-${coll}-${f.k}`; let input;
    if (f.t==="select"){ input=h("select",{id,name:f.k}, f.o.map(o=>h("option",{value:o,text:o}))); input.value=val[f.k]||f.o[0]; }
    else if (f.t==="textarea"){ input=h("textarea",{id,name:f.k}); input.value=val[f.k]??""; }
    else { input=h("input",{id,name:f.k,type:f.t==="number"?"number":f.t==="date"?"date":"text",inputmode:f.t==="number"?"decimal":null}); input.value=val[f.k]??""; }
    if (coll==="daily" && f.k==="date" && !isNew) input.disabled=true;
    grid.append(h("label",{class:"f"+(f.full?" full":""),for:id},f.l,input));
  }
  const err=h("div",{class:"status-line err"});
  const foot=h("div",{class:"sheet-foot"});
  const left=h("div",{style:"display:flex;gap:8px;align-items:center"});
  if (!isNew){
    const del=h("button",{class:"btn danger ghost",type:"button",text:sch.delLabel||"Xoá"});
    del.onclick=()=>{ left.replaceChildren(h("span",{class:"confirm",text:"Xoá mục này?"}),
      h("button",{class:"btn sm danger",type:"button",text:"Xoá hẳn",onclick:async()=>{try{await db.doc(`${coll}/${doc._id}`).delete();close();toast("Đã xoá");}catch(e){err.textContent=errMsg(e);}}}),
      h("button",{class:"btn sm ghost",type:"button",text:"Không",onclick:()=>left.replaceChildren(del)})); };
    left.append(del);
  }
  foot.append(left,h("div",{style:"display:flex;gap:8px"},
    h("button",{class:"btn ghost",type:"button",text:"Huỷ",onclick:()=>close()}),
    h("button",{class:"btn primary",type:"submit",text:isNew?"Thêm":"Lưu"})));
  form.append(h("h3",{text:(isNew?"Thêm ":"Cập nhật ")+sch.label}),grid,err,foot);
  form.addEventListener("submit",async e=>{
    e.preventDefault(); if(!db){err.textContent="Chưa kết nối kho dữ liệu.";return;}
    const out={};
    for (const f of sch.fields){ const el=form.elements[f.k]; let v=el.value.trim(); if(f.t==="number") v = v===""?null:+v; out[f.k]=v; }
    out.updated=isoToday;
    try{
      let id = doc? doc._id : (coll==="config" ? "main" : null);
      if (coll==="daily"){ if(!out.date){err.textContent="Cần chọn ngày.";return;} id = doc? doc._id : out.date; if(!doc) out.date=out.date; else out.date=doc.date; }
      if (id) await db.doc(`${coll}/${id}`).set(out); else await db.collection(coll).add(out);
      close(); toast(isNew?"Đã thêm":"Đã lưu");
    }catch(ex){ err.textContent=errMsg(ex); }
  });
  const scrim=h("div",{class:"scrim",onclick:e=>{if(e.target===scrim)close();}},form);
  function close(){ host.replaceChildren(); document.removeEventListener("keydown",esc); }
  function esc(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown",esc);
  host.append(scrim);
  const first=form.querySelector("input:not([disabled]),select,textarea"); first&&first.focus();
}
function errMsg(e){
  const c=e&&e.code;
  if (c==="invalid_argument") return "Bạn chưa có quyền chỉnh sửa. Nhờ người tạo trang cấp quyền Contributor.";
  if (c==="quota_exceeded") return "Kho dữ liệu đã đầy. Xoá bớt mục cũ rồi thử lại.";
  if (c==="resource_exhausted") return "Thao tác quá nhanh, đợi vài giây rồi thử lại.";
  return "Không lưu được. Kiểm tra mạng rồi thử lại.";
}
function toast(t){ const host=$("#toastHost"); host.replaceChildren(h("div",{class:"toast",text:t})); setTimeout(()=>host.replaceChildren(),2200); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast("Đã sao chép"); }catch(e){ toast("Không sao chép được – hãy chọn và chép thủ công"); }
}

/* ---------- Zalo message ---------- */
function buildZalo(){
  const d=new Date(); const L=[];
  L.push(`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()} ${getCfg().code}`,"Mục tiêu thi công ngày","","A- MỤC TIÊU NGẮN HẠN","");
  const items=[...S.items].sort((a,b)=>(num(a.pri)??99)-(num(b.pri)??99));
  const byPri={}; items.forEach(i=>{(byPri[i.pri??"–"] ||= []).push(i);});
  for (const [p,arr] of Object.entries(byPri)){
    L.push(`- Ưu tiên ${p}: ` + arr.map(i=>`${i.name} (${i.deadline?fmtShort(i.deadline).replace("/","."):(i.deadlineText||"")})${i.status&&i.status!=="Đang làm"?" – "+i.status:""}`).join("; "));
  }
  L.push("","B- TỔ CHỨC THI CÔNG CHI TIẾT","");
  items.filter(i=>i.next||i.progress).forEach((i,k)=>{
    L.push(`${k+1}. ${i.name}${i.owner?` (${i.owner})`:""}`);
    if (i.progress) L.push(`- Tiến độ: ${i.progress}`);
    if (i.next) i.next.split("\n").forEach(x=>x.trim()&&L.push(`- ${x.replace(/^[-•]\s*/,"")}`));
    L.push("");
  });
  const yd=S.yards.filter(y=>num(y.workers)||num(y.output));
  if (yd.length){ L.push("Bãi đúc ga hôm nay:"); yd.forEach(y=>L.push(`- ${y.name} (${y.td||""}): ${nf(num(y.workers))} quân, ${nf(num(y.output))} ga`)); L.push(""); }
  const dl=latestDaily();
  if (dl && num(dl.cnch)!=null) L.push(`CNCH tháng: ${dl.cnch}/${dl.cnchPlan} CN (${Math.round(dl.cnch/dl.cnchPlan*100)}%)`,"");
  const oi=openIssues();
  if (oi.length){ L.push("C- Vướng mắc lớn"); oi.forEach((i,k)=>L.push(`${k+1}. ${i.text}${i.owner?` – ${i.owner}`:""}${i.due?` (hạn ${fmtShort(i.due)})`:""}`)); }
  return L.join("\n");
}
function openZalo(){
  const host=$("#sheetHost"); host.replaceChildren();
  const ta=h("textarea",{class:"copybox",id:"zaloText"}); ta.value=buildZalo();
  const sheet=h("div",{class:"sheet",role:"dialog","aria-modal":"true"},
    h("h3",{text:"Tin nhắn mục tiêu ngày"}),
    h("p",{class:"detail",style:"margin:0",text:"Soạn tự động từ dữ liệu trên bảng. Có thể sửa trước khi chép sang nhóm Zalo."}),ta,
    h("div",{class:"sheet-foot"},h("span"),h("div",{style:"display:flex;gap:8px"},
      h("button",{class:"btn ghost",type:"button",text:"Đóng",onclick:()=>host.replaceChildren()}),
      h("button",{class:"btn primary",type:"button",text:"Chép tin nhắn",onclick:async()=>{try{await navigator.clipboard.writeText(ta.value);toast("Đã chép – dán vào Zalo");}catch(e){ta.select();toast("Đã chọn sẵn nội dung, nhấn Ctrl+C để chép");}}}))));
  const scrim=h("div",{class:"scrim",onclick:e=>{if(e.target===scrim)host.replaceChildren();}},sheet);
  host.append(scrim);
}
$("#btnZalo").onclick=openZalo;
$("#btnAdd").onclick=()=>{
  const map={items:"items",ga:"yards",issues:"issues",daily:"daily",info:"contacts"};
  const c=map[tab]; if(c==="daily"){const prev=latestDaily();openEditor("daily",null,prev?{...prev,date:isoToday,weather:"",note:"",gaWorkers:"",gaOutput:""}:{date:isoToday});} else openEditor(c,null);
};

/* ---------- Render ---------- */
function render(){
  renderHeader(); renderKpis(); renderTabs();
  const p=$("#panel"); p.replaceChildren();
  const R={items:renderItems,ga:renderGa,issues:renderIssues,daily:renderDaily,info:renderInfo,bot:renderBotControl};
  if (printAll){ const keep=filter; filter="all"; for (const t of TABS){ p.append(h("div",{class:"print-title",text:t.l})); R[t.id](); } filter=keep; return; }
  (R[tab]||renderItems)();
}
render();

/* ---------- Local data store ---------- */
const KEY="td3-bang-dieu-hanh-v1";
let STORE={savedAt:null,data:{},deleted:{}};
let dirty=false, lastExport=null;
function readSeed(){ try{ return JSON.parse(document.getElementById("td3-data").textContent); }catch(e){ return {data:{},deleted:{}}; } }
function mergeInto(base, inc){
  let changed=0; base.data=base.data||{}; base.deleted=base.deleted||{};
  const incDel=inc.deleted||{};
  for (const c of Object.keys(S)){
    const map=new Map((base.data[c]||[]).map(d=>[d._id,d]));
    for (const d of (inc.data&&inc.data[c])||[]){
      const cur=map.get(d._id);
      if (!cur || (d._ts||"")>(cur._ts||"")){ map.set(d._id,d); changed++; }
    }
    const del={...(base.deleted[c]||{})};
    for (const [id,ts] of Object.entries(incDel[c]||{})) if(!del[id]||ts>del[id]) del[id]=ts;
    for (const [id,ts] of Object.entries(del)){ const d=map.get(id); if(d && (d._ts||"")<ts){ map.delete(id); changed++; } }
    base.data[c]=[...map.values()]; base.deleted[c]=del;
  }
  return changed;
}
function syncS(){ for (const c of Object.keys(S)){ S[c]=(STORE.data[c]||[]).map(d=>({...d})); loaded[c]=true; } }
function persist(){
  STORE.savedAt=new Date().toISOString();
  try{ localStorage.setItem(KEY,JSON.stringify(STORE)); }catch(e){}
  dirty=true; saveState();
}
function saveState(){
  const bar=$("#saveBar"), t=$("#saveTxt"); if(!bar) return;
  if (!STORE.savedAt || STORE.savedAt.startsWith("2000")){ bar.classList.remove("dirty"); t.textContent="Dữ liệu ban đầu (15–25/9) · bấm vào ô hoặc dòng bất kỳ để sửa"; return; }
  const at=STORE.savedAt?new Date(STORE.savedAt).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}):"—";
  bar.classList.toggle("dirty",dirty);
  t.textContent = dirty ? `Đã lưu trên máy này lúc ${at} · có thay đổi chưa xuất file HTML để gửi` : `Dữ liệu cập nhật lúc ${at}`;
}
const nowIso=()=>new Date().toISOString();
function upsert(c,doc){ const arr=STORE.data[c]=(STORE.data[c]||[]).filter(d=>d._id!==doc._id); arr.push({...doc,_ts:nowIso()}); persist(); syncS(); render(); }
function removeDoc(c,id){ STORE.data[c]=(STORE.data[c]||[]).filter(d=>d._id!==id); (STORE.deleted[c] ||= {})[id]=nowIso(); persist(); syncS(); render(); }
db={
  doc(path){ const [c,id]=path.split("/"); return { async set(o){ upsert(c,{...o,_id:id}); }, async delete(){ removeDoc(c,id); } }; },
  collection(c){ return { async add(o){ upsert(c,{...o,_id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}); } }; }
};
(function boot(){
  const seed=readSeed(); STORE={savedAt:seed.savedAt||null,data:seed.data||{},deleted:seed.deleted||{}};
  try{
    const local=JSON.parse(localStorage.getItem(KEY)||"null");
    if (local){ mergeInto(STORE,local); if(local.savedAt>(STORE.savedAt||"")) STORE.savedAt=local.savedAt; }
  }catch(e){}
  syncS(); saveState(); render();
})();

/* ---------- Save / import / print ---------- */
function exportHtml(){
  const payload=JSON.stringify({savedAt:STORE.savedAt||nowIso(),data:STORE.data,deleted:STORE.deleted}).replace(/</g,"\\u003c");
  const tagAt=PRISTINE.indexOf('id="td3-data"'), open=PRISTINE.indexOf(">",tagAt)+1, close=PRISTINE.indexOf("<"+"/script>",open);
  const html=PRISTINE.slice(0,open)+payload+PRISTINE.slice(close);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`Bang-dieu-hanh-TD3_${isoToday}.html`; document.body.append(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  dirty=false; saveState(); toast("Đã lưu file – gửi file này qua Zalo");
}
$("#btnSave").onclick=exportHtml;
$("#btnImport").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const txt=await f.text(); let inc;
    if (/\.json$/i.test(f.name)) inc=JSON.parse(txt);
    else { const doc=new DOMParser().parseFromString(txt,"text/html"); const el=doc.getElementById("td3-data"); if(!el) throw new Error("x"); inc=JSON.parse(el.textContent); }
    const n=mergeInto(STORE,inc); persist(); syncS(); render();
    toast(n?`Đã gộp ${n} mục mới/cập nhật từ ${f.name}`:"File không có số liệu nào mới hơn");
  }catch(ex){ toast("File không đúng định dạng Bảng điều hành TĐ3"); }
};
$("#helpHide").onclick=()=>setCfg({showHelp:"Ẩn"});
$("#helpShow").onclick=()=>setCfg({showHelp:"Hiện"});
$("#helpEdit").onclick=editCfg;
$("#btnHead").onclick=editCfg;
